# The EstateOS API on Render. The web app is on Vercel and reaches this
# service through the rewrites in apps/web/vercel.json, so both must use the
# same address (https://estateos-api-iy6k.onrender.com).
#
# No external database: the API runs its own built-in MongoDB, as in
# development. On the free plan the disk is temporary, so whenever the service
# restarts or redeploys the data goes back to the demo data. Set MONGODB_URI
# (e.g. a MongoDB Atlas cluster) to keep data permanently instead.
services:
  - type: web
    name: estateos-api
    runtime: node
    plan: free
    region: singapore
    # tsx (which runs the TypeScript server) is a dev dependency, so install those too.
    # The install also downloads the built-in MongoDB.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @estate/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
