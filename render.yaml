# The EstateOS API on Render. The web app is on Vercel and reaches this
# service through the rewrites in apps/web/vercel.json, so both must use the
# same address (https://estateos-api.onrender.com).
services:
  - type: web
    name: estateos-api
    runtime: node
    plan: free
    region: singapore
    # tsx (which runs the TypeScript server) is a dev dependency, so install those too.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @estate/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # A real MongoDB is used in production; skip downloading the embedded one.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
