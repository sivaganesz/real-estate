# Local development services. Start with: pnpm db:up
services:
  mongo:
    image: mongo:7
    container_name: real-estate-mongo
    restart: unless-stopped
    ports:
      - '27018:27017' # host port 27018 avoids clashing with a locally installed MongoDB
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
